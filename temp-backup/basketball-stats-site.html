<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSV FLAMINGO'S STATS • Miami Vice Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --vice-black: #0B0B0B;
            --vice-dark: #1a1a2e;
            --vice-pink: #FF006E;
            --vice-blue: #00F5FF;
            --vice-purple: #B026FF;
            --vice-yellow: #FFD23F;
            --vice-gradient: linear-gradient(135deg, #FF006E 0%, #00F5FF 100%);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--vice-black);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 0, 110, 0.03) 2px,
                    rgba(255, 0, 110, 0.03) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 245, 255, 0.03) 2px,
                    rgba(0, 245, 255, 0.03) 4px
                );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(180deg, rgba(255,0,110,0.1) 0%, transparent 100%);
            border-bottom: 2px solid var(--vice-pink);
            margin-bottom: 40px;
            position: relative;
        }

        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 5em;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--vice-pink), var(--vice-blue), var(--vice-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 
                0 0 30px var(--vice-pink),
                0 0 60px var(--vice-blue);
            animation: glow 2s ease-in-out infinite alternate;
        }

        .flamingo-icon {
            font-size: 0.7em;
            vertical-align: middle;
            margin: 0 10px;
        }

        @keyframes glow {
            from { filter: brightness(1) saturate(1); }
            to { filter: brightness(1.2) saturate(1.5); }
        }

        .team-info {
            color: var(--vice-blue);
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid var(--vice-pink);
            color: var(--vice-pink);
            font-family: 'Bebas Neue', cursive;
            font-size: 18px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--vice-gradient);
            transition: left 0.3s;
            z-index: -1;
        }

        .tab:hover::before {
            left: 0;
        }

        .tab:hover {
            color: var(--vice-black);
            box-shadow: 
                0 0 20px var(--vice-pink),
                inset 0 0 20px rgba(255,0,110,0.2);
        }

        .tab.active {
            background: var(--vice-gradient);
            color: var(--vice-black);
            font-weight: 700;
            box-shadow: 
                0 0 30px var(--vice-pink),
                0 0 60px var(--vice-blue);
        }

        .content {
            display: none;
            animation: neonFadeIn 0.5s;
        }

        .content.active {
            display: block;
        }

        @keyframes neonFadeIn {
            from { 
                opacity: 0; 
                transform: translateY(20px);
                filter: blur(10px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,0,110,0.1) 0%, rgba(0,245,255,0.1) 100%);
            border: 2px solid var(--vice-pink);
            padding: 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--vice-gradient);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
            filter: blur(10px);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 10px 30px rgba(255,0,110,0.5),
                0 10px 60px rgba(0,245,255,0.3);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-label {
            font-family: 'Bebas Neue', cursive;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--vice-blue);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-value {
            font-family: 'Bebas Neue', cursive;
            font-size: 48px;
            letter-spacing: 2px;
            background: linear-gradient(180deg, white, var(--vice-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--vice-blue);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 30px;
            background: rgba(26, 26, 46, 0.6);
            border: 2px solid var(--vice-pink);
            overflow: hidden;
        }

        th {
            background: linear-gradient(90deg, var(--vice-pink), var(--vice-purple));
            color: var(--vice-black);
            padding: 15px 10px;
            text-align: left;
            font-family: 'Bebas Neue', cursive;
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 400;
            text-transform: uppercase;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,0,110,0.2);
            color: white;
            font-size: 15px;
            font-weight: 600;
        }

        tr {
            transition: all 0.3s;
        }

        tr:hover {
            background: rgba(255,0,110,0.1);
            box-shadow: 
                inset 0 0 30px rgba(255,0,110,0.1),
                inset 0 0 60px rgba(0,245,255,0.05);
        }

        .player-link {
            color: var(--vice-blue);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            cursor: pointer;
            display: inline-block;
        }

        .player-link:hover {
            color: var(--vice-pink);
            text-shadow: 
                0 0 10px var(--vice-pink),
                0 0 20px var(--vice-blue);
            transform: translateX(5px);
        }

        .position-badge {
            display: inline-block;
            padding: 3px 12px;
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
            font-size: 12px;
            border: 1px solid;
            text-transform: uppercase;
        }

        .position-base {
            border-color: var(--vice-blue);
            color: var(--vice-blue);
            background: rgba(0,245,255,0.1);
        }

        .position-alero {
            border-color: var(--vice-purple);
            color: var(--vice-purple);
            background: rgba(176,38,255,0.1);
        }

        .position-pivot {
            border-color: var(--vice-yellow);
            color: var(--vice-yellow);
            background: rgba(255,210,63,0.1);
        }

        .positive {
            color: var(--vice-blue);
            font-weight: 700;
            text-shadow: 0 0 10px var(--vice-blue);
        }

        .negative {
            color: var(--vice-pink);
            font-weight: 700;
            text-shadow: 0 0 10px var(--vice-pink);
        }

        select {
            background: var(--vice-black);
            border: 2px solid var(--vice-pink);
            color: white;
            padding: 10px 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover,
        select:focus {
            box-shadow: 
                0 0 20px var(--vice-pink),
                inset 0 0 20px rgba(255,0,110,0.2);
            outline: none;
        }

        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            padding: 10px 20px;
            background: transparent;
            border: 2px solid var(--vice-blue);
            color: var(--vice-blue);
            font-family: 'Bebas Neue', cursive;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            z-index: 100;
        }

        .back-button:hover {
            background: var(--vice-blue);
            color: var(--vice-black);
            box-shadow: 
                0 0 20px var(--vice-blue),
                0 0 40px var(--vice-pink);
        }

        .player-header {
            text-align: center;
            padding: 60px 0 40px;
            background: linear-gradient(180deg, rgba(255,0,110,0.2) 0%, transparent 100%);
            border-bottom: 3px solid var(--vice-gradient);
            margin-bottom: 40px;
        }

        .player-number {
            font-family: 'Bebas Neue', cursive;
            font-size: 120px;
            color: var(--vice-pink);
            text-shadow: 
                0 0 30px var(--vice-pink),
                0 0 60px var(--vice-blue);
            line-height: 1;
        }

        .player-name-large {
            font-family: 'Bebas Neue', cursive;
            font-size: 60px;
            letter-spacing: 3px;
            background: var(--vice-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        .player-position-large {
            font-size: 24px;
            letter-spacing: 3px;
            color: var(--vice-blue);
            text-transform: uppercase;
        }

        .player-stats-section {
            margin: 40px 0;
        }

        .section-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 32px;
            letter-spacing: 2px;
            color: var(--vice-pink);
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 20px var(--vice-pink);
        }

        .match-card {
            background: rgba(26, 26, 46, 0.8);
            border: 2px solid rgba(255,0,110,0.3);
            padding: 20px;
            margin: 15px 0;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 30px;
            align-items: center;
            transition: all 0.3s;
        }

        .match-card:hover {
            border-color: var(--vice-pink);
            box-shadow: 
                0 0 20px rgba(255,0,110,0.3),
                inset 0 0 30px rgba(255,0,110,0.05);
        }

        .match-date {
            font-family: 'Bebas Neue', cursive;
            color: var(--vice-blue);
            font-size: 18px;
            letter-spacing: 1px;
        }

        .match-opponent {
            font-weight: 700;
            color: white;
        }

        .match-stats {
            display: flex;
            gap: 20px;
            justify-content: flex-end;
        }

        .match-stat {
            text-align: center;
        }

        .match-stat-label {
            font-size: 12px;
            color: var(--vice-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-stat-value {
            font-family: 'Bebas Neue', cursive;
            font-size: 24px;
            color: white;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--vice-blue);
            font-size: 18px;
            font-style: italic;
            background: rgba(0,245,255,0.05);
            border: 1px dashed var(--vice-blue);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" id="backButton" style="display: none;" onclick="showMainView()">← Volver</button>
        
        <div id="mainView">
            <div class="header">
                <h1><span class="flamingo-icon">🦩</span>BSV FLAMINGO'S STATS<span class="flamingo-icon">🦩</span></h1>
                <div class="team-info">Liga Segunda Alquiería del bàsquet • Temporada 2025-26</div>
            </div>

            <div class="nav-tabs">
                <button class="tab active" onclick="showTab('general')">General</button>
                <button class="tab" onclick="showTab('matches')">Partidos</button>
                <button class="tab" onclick="showTab('team')">Equipo</button>
                <button class="tab" onclick="showTab('roster')">Plantilla</button>
            </div>

            <!-- Resumen General -->
            <div id="general" class="content active">
                <div class="stats-grid" id="generalStats"></div>
                <table id="generalTable"></table>
            </div>

            <!-- Por Partido -->
            <div id="matches" class="content">
                <div style="text-align: center; margin-bottom: 30px;">
                    <select id="matchSelect" onchange="updateMatchStats()"></select>
                </div>
                <div class="stats-grid" id="matchSummary"></div>
                <div id="matchTableContainer"></div>
            </div>

            <!-- Equipo Acumulado -->
            <div id="team" class="content">
                <table id="teamTable"></table>
            </div>

            <!-- Plantilla con enlaces a fichas -->
            <div id="roster" class="content">
                <div class="stats-grid" id="rosterGrid"></div>
            </div>
        </div>

        <!-- Vista de jugador individual -->
        <div id="playerView" style="display: none;">
            <div id="playerContent"></div>
        </div>
    </div>

    <script>
        // Datos de los jugadores del equipo
        const players = [
            { id: 4, name: "Raul Mestre Lleida", number: 4, position: "Base" },
            { id: 5, name: "Francisco Jesús Puertollano García", number: 5, position: "Base" },
            { id: 6, name: "Pau Bas Sanjuan", number: 6, position: "Base" },
            { id: 7, name: "Carlos Aparicio Nieto", number: 7, position: "Alero" },
            { id: 10, name: "Jose Fernando Rodriguez Guerra", number: 10, position: "Alero" },
            { id: 11, name: "Ricardo César Juanicotena", number: 11, position: "Alero" },
            { id: 15, name: "Jose Vicente González Cabrera", number: 15, position: "Pívot" },
            { id: 21, name: "Hernán Martín D'Amelio Acuña", number: 21, position: "Pívot" },
            { id: 24, name: "Nicolas Arias", number: 24, position: "Pívot" },
            { id: 32, name: "Claudio Castellazzi", number: 32, position: "Alero" },
            { id: 33, name: "Dmytro Khomenko", number: 33, position: "Pívot" },
            { id: 44, name: "Juan Ignacio Vieytes", number: 44, position: "Base" }
        ];

        // Datos de los partidos jugados
        const matches = [
            {
                id: 1,
                date: "2025-01-12",
                opponent: "Secuelas Pías",
                home: false,
                ourScore: 54,
                oppScore: 47,
                stats: [] // Sin datos aún
            },
            {
                id: 2,
                date: "2025-01-19",
                opponent: "Panathimankos",
                home: true,
                ourScore: 52,
                oppScore: 60,
                stats: [] // Sin datos aún
            },
            {
                id: 3,
                date: "2025-01-26",
                opponent: "Drinkers",
                home: false,
                ourScore: 49,
                oppScore: 35,
                stats: [] // Sin datos aún
            },
            {
                id: 4,
                date: "2025-02-02",
                opponent: "ATC Na Rovella",
                home: true,
                ourScore: 61,
                oppScore: 63,
                stats: [
                    { playerId: 4, minutes: "23:35", points: 2, t2Made: 1, t3Made: 0, ftMade: 0, ftAttempted: 0, fouls: 1, plusMinus: 7 },
                    { playerId: 5, minutes: "09:21", points: 0, t2Made: 0, t3Made: 0, ftMade: 0, ftAttempted: 0, fouls: 1, plusMinus: -7 },
                    { playerId: 6, minutes: "18:53", points: 0, t2Made: 0, t3Made: 0, ftMade: 0, ftAttempted: 0, fouls: 0, plusMinus: -15 },
                    { playerId: 7, minutes: "19:32", points: 3, t2Made: 1, t3Made: 0, ftMade: 1, ftAttempted: 2, fouls: 2, plusMinus: -14 },
                    { playerId: 10, minutes: "19:22", points: 9, t2Made: 4, t3Made: 0, ftMade: 1, ftAttempted: 2, fouls: 2, plusMinus: 4 },
                    { playerId: 11, minutes: "23:42", points: 9, t2Made: 0, t3Made: 3, ftMade: 0, ftAttempted: 0, fouls: 3, plusMinus: 4 },
                    { playerId: 15, minutes: "15:40", points: 7, t2Made: 2, t3Made: 1, ftMade: 0, ftAttempted: 2, fouls: 1, plusMinus: 18 },
                    { playerId: 21, minutes: "09:55", points: 2, t2Made: 1, t3Made: 0, ftMade: 0, ftAttempted: 0, fouls: 0, plusMinus: 1 },
                    { playerId: 24, minutes: "18:51", points: 5, t2Made: 0, t3Made: 0, ftMade: 5, ftAttempted: 12, fouls: 0, plusMinus: 10 },
                    { playerId: 32, minutes: "05:04", points: 3, t2Made: 1, t3Made: 0, ftMade: 1, ftAttempted: 1, fouls: 0, plusMinus: 3 },
                    { playerId: 33, minutes: "26:44", points: 18, t2Made: 5, t3Made: 2, ftMade: 2, ftAttempted: 4, fouls: 0, plusMinus: 4 },
                    { playerId: 44, minutes: "09:21", points: 3, t2Made: 0, t3Made: 1, ftMade: 0, ftAttempted: 2, fouls: 0, plusMinus: 1 }
                ]
            }
        ];

        // Funciones auxiliares
        function getPositionBadge(position) {
            const className = position === 'Base' ? 'position-base' : 
                             position === 'Alero' ? 'position-alero' : 'position-pivot';
            return `<span class="position-badge ${className}">${position}</span>`;
        }

        function calculatePlayerTotals() {
            const totals = {};
            
            players.forEach(player => {
                totals[player.id] = {
                    ...player,
                    games: 0,
                    totalMinutes: 0,
                    t2Made: 0,
                    t3Made: 0,
                    ftMade: 0,
                    ftAttempted: 0,
                    fouls: 0,
                    points: 0,
                    plusMinus: 0
                };
            });

            matches.forEach(match => {
                if (match.stats && match.stats.length > 0) {
                    match.stats.forEach(stat => {
                        const player = totals[stat.playerId];
                        if (player) {
                            player.games++;
                            // Convertir minutos de string "MM:SS" a número
                            if (stat.minutes) {
                                const [min, sec] = stat.minutes.split(':').map(Number);
                                player.totalMinutes += min + (sec/60);
                            }
                            player.t2Made += stat.t2Made || 0;
                            player.t3Made += stat.t3Made || 0;
                            player.ftMade += stat.ftMade || 0;
                            player.ftAttempted += stat.ftAttempted || 0;
                            player.fouls += stat.fouls || 0;
                            player.points += stat.points || 0;
                            player.plusMinus += stat.plusMinus || 0;
                        }
                    });
                }
            });

            return Object.values(totals);
        }

        function calculateTeamTotals() {
            return matches.map(match => {
                const totals = {
                    date: match.date,
                    opponent: match.opponent,
                    home: match.home,
                    ourScore: match.ourScore,
                    oppScore: match.oppScore,
                    result: match.ourScore > match.oppScore ? 'V' : 'D',
                    t2Made: 0,
                    t3Made: 0,
                    ftMade: 0,
                    ftAttempted: 0,
                    fouls: 0,
                    hasData: match.stats && match.stats.length > 0
                };

                if (match.stats && match.stats.length > 0) {
                    match.stats.forEach(stat => {
                        totals.t2Made += stat.t2Made || 0;
                        totals.t3Made += stat.t3Made || 0;
                        totals.ftMade += stat.ftMade || 0;
                        totals.ftAttempted += stat.ftAttempted || 0;
                        totals.fouls += stat.fouls || 0;
                    });
                }

                return totals;
            });
        }

        // Navegación
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'general') showGeneralStats();
            if (tabName === 'matches') initMatchesTab();
            if (tabName === 'team') showTeamStats();
            if (tabName === 'roster') showRoster();
        }

        function showMainView() {
            document.getElementById('mainView').style.display = 'block';
            document.getElementById('playerView').style.display = 'none';
            document.getElementById('backButton').style.display = 'none';
        }

        function showPlayerProfile(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            document.getElementById('mainView').style.display = 'none';
            document.getElementById('playerView').style.display = 'block';
            document.getElementById('backButton').style.display = 'block';

            // Calcular estadísticas del jugador
            const playerMatches = [];
            matches.forEach(match => {
                if (match.stats && match.stats.length > 0) {
                    const stat = match.stats.find(s => s.playerId === playerId);
                    if (stat) {
                        playerMatches.push({
                            ...match,
                            playerStat: stat
                        });
                    }
                }
            });

            const totals = calculatePlayerTotals().find(p => p.id === playerId);
            const ppg = totals.games > 0 ? (totals.points / totals.games).toFixed(1) : '0.0';
            const minutesPerGame = totals.games > 0 ? (totals.totalMinutes / totals.games).toFixed(1) : '0.0';

            const playerHTML = `
                <div class="player-header">
                    <div class="player-number">#${player.number}</div>
                    <div class="player-name-large">${player.name}</div>
                    <div class="player-position-large">${player.position}</div>
                </div>

                <div class="player-stats-section">
                    <div class="section-title">Estadísticas de Temporada</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Partidos Jugados</div>
                            <div class="stat-value">${totals.games}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Minutos por Partido</div>
                            <div class="stat-value">${minutesPerGame}'</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Puntos por Partido</div>
                            <div class="stat-value">${ppg}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">+/- Total</div>
                            <div class="stat-value" style="${totals.plusMinus > 0 ? 'color: var(--vice-blue);' : totals.plusMinus < 0 ? 'color: var(--vice-pink);' : ''}">
                                ${totals.plusMinus > 0 ? '+' : ''}${totals.plusMinus}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="player-stats-section">
                    <div class="section-title">Historial de Partidos</div>
                    ${playerMatches.length > 0 ? playerMatches.map(match => {
                        const stat = match.playerStat;
                        const ftPct = stat.ftAttempted > 0 ? Math.round((stat.ftMade / stat.ftAttempted) * 100) : 0;
                        const result = match.ourScore > match.oppScore ? 'V' : 'D';
                        const resultColor = result === 'V' ? 'var(--vice-blue)' : 'var(--vice-pink)';
                        
                        return `
                            <div class="match-card">
                                <div>
                                    <div class="match-date">${new Date(match.date).toLocaleDateString('es-ES')}</div>
                                    <div class="match-opponent">${match.home ? 'vs' : '@'} ${match.opponent}</div>
                                    <div style="color: ${resultColor}; font-weight: 700; margin-top: 5px;">
                                        ${match.ourScore} - ${match.oppScore} (${result})
                                    </div>
                                </div>
                                <div></div>
                                <div class="match-stats">
                                    <div class="match-stat">
                                        <div class="match-stat-label">MIN</div>
                                        <div class="match-stat-value">${stat.minutes}</div>
                                    </div>
                                    <div class="match-stat">
                                        <div class="match-stat-label">PTS</div>
                                        <div class="match-stat-value">${stat.points}</div>
                                    </div>
                                    <div class="match-stat">
                                        <div class="match-stat-label">T2</div>
                                        <div class="match-stat-value">${stat.t2Made}</div>
                                    </div>
                                    <div class="match-stat">
                                        <div class="match-stat-label">T3</div>
                                        <div class="match-stat-value">${stat.t3Made}</div>
                                    </div>
                                    <div class="match-stat">
                                        <div class="match-stat-label">TL</div>
                                        <div class="match-stat-value">${stat.ftMade}/${stat.ftAttempted}</div>
                                    </div>
                                    <div class="match-stat">
                                        <div class="match-stat-label">FAL</div>
                                        <div class="match-stat-value">${stat.fouls}</div>
                                    </div>
                                    <div class="match-stat">
                                        <div class="match-stat-label">+/-</div>
                                        <div class="match-stat-value" style="color: ${stat.plusMinus > 0 ? 'var(--vice-blue)' : stat.plusMinus < 0 ? 'var(--vice-pink)' : 'white'}">
                                            ${stat.plusMinus > 0 ? '+' : ''}${stat.plusMinus}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('') : '<div class="no-data">Todavía no hay partidos jugados con estadísticas disponibles</div>'}
                </div>
            `;

            document.getElementById('playerContent').innerHTML = playerHTML;
        }

        function showRoster() {
            const playerTotals = calculatePlayerTotals();
            
            document.getElementById('rosterGrid').innerHTML = playerTotals.map(player => {
                const ppg = player.games > 0 ? (player.points / player.games).toFixed(1) : '0.0';
                
                return `
                    <div class="stat-card" style="cursor: pointer;" onclick="showPlayerProfile(${player.id})">
                        <div style="font-family: 'Bebas Neue', cursive; font-size: 48px; color: var(--vice-pink); margin-bottom: 10px;">
                            #${player.number}
                        </div>
                        <div style="font-size: 20px; font-weight: 700; margin-bottom: 10px;">
                            ${player.name}
                        </div>
                        ${getPositionBadge(player.position)}
                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,0,110,0.3);">
                            <div style="color: var(--vice-blue); font-size: 14px;">PPP: ${ppg}</div>
                            <div style="color: var(--vice-blue); font-size: 14px;">PJ: ${player.games}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showGeneralStats() {
            const wins = matches.filter(m => m.ourScore > m.oppScore).length;
            const losses = matches.length - wins;
            const totalOurPoints = matches.reduce((sum, m) => sum + m.ourScore, 0);
            const totalOppPoints = matches.reduce((sum, m) => sum + m.oppScore, 0);
            const avgOurPoints = (totalOurPoints / matches.length).toFixed(1);
            const avgOppPoints = (totalOppPoints / matches.length).toFixed(1);

            document.getElementById('generalStats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Partidos Jugados</div>
                    <div class="stat-value">${matches.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Récord</div>
                    <div class="stat-value">${wins}-${losses}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Promedio PTS Favor</div>
                    <div class="stat-value">${avgOurPoints}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Promedio PTS Contra</div>
                    <div class="stat-value">${avgOppPoints}</div>
                </div>
            `;

            const playerTotals = calculatePlayerTotals();
            
            document.getElementById('generalTable').innerHTML = `
                <thead>
                    <tr>
                        <th>Jugador</th>
                        <th>Pos</th>
                        <th>PJ</th>
                        <th>MIN</th>
                        <th>PTS</th>
                        <th>T2</th>
                        <th>T3</th>
                        <th>TL</th>
                        <th>Faltas</th>
                        <th>+/-</th>
                    </tr>
                </thead>
                <tbody>
                    ${playerTotals.filter(p => p.games > 0).sort((a, b) => b.points - a.points).map(player => {
                        const avgMinutes = player.games > 0 ? (player.totalMinutes / player.games).toFixed(1) : '0.0';
                        const ftPct = player.ftAttempted > 0 ? Math.round((player.ftMade / player.ftAttempted) * 100) : 0;
                        const plusMinusClass = player.plusMinus > 0 ? 'positive' : player.plusMinus < 0 ? 'negative' : '';
                        
                        return `
                            <tr>
                                <td><a class="player-link" onclick="showPlayerProfile(${player.id})">${player.name}</a></td>
                                <td>${getPositionBadge(player.position)}</td>
                                <td>${player.games}</td>
                                <td>${avgMinutes}'</td>
                                <td><strong>${player.points}</strong></td>
                                <td>${player.t2Made}</td>
                                <td>${player.t3Made}</td>
                                <td>${player.ftMade}/${player.ftAttempted} (${ftPct}%)</td>
                                <td>${player.fouls}</td>
                                <td class="${plusMinusClass}">${player.plusMinus > 0 ? '+' : ''}${player.plusMinus}</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            `;
        }

        function initMatchesTab() {
            const select = document.getElementById('matchSelect');
            select.innerHTML = matches.map(match => 
                `<option value="${match.id}">
                    ${new Date(match.date).toLocaleDateString('es-ES')} - ${match.home ? 'LOCAL' : 'VISITANTE'} vs ${match.opponent} 
                    (${match.ourScore}-${match.oppScore} ${match.ourScore > match.oppScore ? 'V' : 'D'})
                </option>`
            ).join('');
            updateMatchStats();
        }

        function updateMatchStats() {
            const matchId = parseInt(document.getElementById('matchSelect').value);
            const match = matches.find(m => m.id === matchId);
            
            const result = match.ourScore > match.oppScore ? 'VICTORIA' : 'DERROTA';
            
            document.getElementById('matchSummary').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Resultado</div>
                    <div class="stat-value">${match.ourScore}-${match.oppScore}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Estado</div>
                    <div class="stat-value">${result}</div>
                </div>
            `;

            if (match.stats && match.stats.length > 0) {
                document.getElementById('matchTableContainer').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Jugador</th>
                                <th>Pos</th>
                                <th>MIN</th>
                                <th>PTS</th>
                                <th>T2</th>
                                <th>T3</th>
                                <th>TL</th>
                                <th>Faltas</th>
                                <th>+/-</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${match.stats.sort((a, b) => b.points - a.points).map(stat => {
                                const player = players.find(p => p.id === stat.playerId);
                                const ftPct = stat.ftAttempted > 0 ? Math.round((stat.ftMade / stat.ftAttempted) * 100) : 0;
                                const plusMinusClass = stat.plusMinus > 0 ? 'positive' : stat.plusMinus < 0 ? 'negative' : '';
                                
                                return `
                                    <tr>
                                        <td><a class="player-link" onclick="showPlayerProfile(${player.id})">${player.name}</a></td>
                                        <td>${getPositionBadge(player.position)}</td>
                                        <td>${stat.minutes}</td>
                                        <td><strong>${stat.points}</strong></td>
                                        <td>${stat.t2Made}</td>
                                        <td>${stat.t3Made}</td>
                                        <td>${stat.ftMade}/${stat.ftAttempted}</td>
                                        <td>${stat.fouls}</td>
                                        <td class="${plusMinusClass}">${stat.plusMinus > 0 ? '+' : ''}${stat.plusMinus}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                document.getElementById('matchTableContainer').innerHTML = `
                    <div class="no-data">
                        ⏳ Todavía se están procesando los datos de este partido
                    </div>
                `;
            }
        }

        function showTeamStats() {
            const teamTotals = calculateTeamTotals();
            
            document.getElementById('teamTable').innerHTML = `
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Rival</th>
                        <th>L/V</th>
                        <th>Resultado</th>
                        <th>T2</th>
                        <th>T3</th>
                        <th>TL</th>
                        <th>Faltas</th>
                        <th>V/D</th>
                    </tr>
                </thead>
                <tbody>
                    ${teamTotals.map(game => {
                        const ftPct = game.ftAttempted > 0 ? Math.round((game.ftMade / game.ftAttempted) * 100) : 0;
                        const resultClass = game.result === 'V' ? 'positive' : 'negative';
                        
                        if (game.hasData) {
                            return `
                                <tr>
                                    <td>${new Date(game.date).toLocaleDateString('es-ES')}</td>
                                    <td><strong>${game.opponent}</strong></td>
                                    <td>${game.home ? 'LOCAL' : 'VIS'}</td>
                                    <td><strong>${game.ourScore}-${game.oppScore}</strong></td>
                                    <td>${game.t2Made}</td>
                                    <td>${game.t3Made}</td>
                                    <td>${game.ftMade}/${game.ftAttempted}</td>
                                    <td>${game.fouls}</td>
                                    <td class="${resultClass}"><strong>${game.result}</strong></td>
                                </tr>
                            `;
                        } else {
                            return `
                                <tr>
                                    <td>${new Date(game.date).toLocaleDateString('es-ES')}</td>
                                    <td><strong>${game.opponent}</strong></td>
                                    <td>${game.home ? 'LOCAL' : 'VIS'}</td>
                                    <td><strong>${game.ourScore}-${game.oppScore}</strong></td>
                                    <td colspan="4" style="text-align: center; font-style: italic; color: var(--vice-blue);">
                                        ⏳ Procesando datos...
                                    </td>
                                    <td class="${resultClass}"><strong>${game.result}</strong></td>
                                </tr>
                            `;
                        }
                    }).join('')}
                </tbody>
            `;
        }

        // Inicializar
        showGeneralStats();
    </script>
</body>
</html>
